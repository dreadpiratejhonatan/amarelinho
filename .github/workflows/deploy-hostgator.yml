# Sobe release/hostgator-amarelinho/ na HostGator via FTP → jhonatanribeiro.com/amarelinho/
name: Deploy HostGator

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-hostgator
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # PIN só no secret do GitHub — nunca no repositório público
      - name: Inject pitacos admin PIN
        env:
          PITACOS_ADMIN_PIN: ${{ secrets.PITACOS_ADMIN_PIN }}
        run: |
          if [ -z "$PITACOS_ADMIN_PIN" ]; then
            echo "::warning::Secret PITACOS_ADMIN_PIN ausente — login de aprovação fica bloqueado até configurar."
            exit 0
          fi
          node <<'NODE'
          const fs = require("fs");
          const path = "release/hostgator-amarelinho/pitacos/config.local.php";
          const pin = process.env.PITACOS_ADMIN_PIN;
          const escaped = pin.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
          fs.mkdirSync("release/hostgator-amarelinho/pitacos", { recursive: true });
          fs.writeFileSync(path, `<?php\nreturn ['admin_pin' => '${escaped}'];\n`);
          console.log("config.local.php gerado (PIN não aparece nos logs).");
          NODE

      - name: FTP upload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTGATOR_FTP_HOST }}
          username: ${{ secrets.HOSTGATOR_FTP_USER }}
          password: ${{ secrets.HOSTGATOR_FTP_PASSWORD }}
          local-dir: ./release/hostgator-amarelinho/
          # Pasta remota do Amarelinho — só no secret HOSTGATOR_FTP_DIR
          server-dir: ${{ secrets.HOSTGATOR_FTP_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            pitacos/data/**
            pitacos/data/**/**
            sugestoes/data/**
            sugestoes/data/**/**
